name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-integration-authority:
    name: Ephemeral PostgreSQL integration authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emberos_test
          POSTGRES_USER: emberos
          POSTGRES_PASSWORD: emberos-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emberos -d emberos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EMBEROS_TEST_DB_ENVIRONMENT: test
      RUN_DB_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://emberos:emberos-ci-only@127.0.0.1:5432/emberos_test
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test database mutation guard
        run: pnpm exec vitest run --config vitest.config.ts tests/test-db-authority-guard.test.ts

      - name: Apply canonical Drizzle schema
        run: pnpm --filter @ceo-agent/db exec drizzle-kit push --force

      - name: Certify ephemeral PostgreSQL behavior
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/ai-story-ci-postgres-authority.integration.test.ts

  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: sk-placeholder
      EXPORT_PAYWALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm --filter @ceo-agent/web build

  smoke-local:
    name: Smoke /api/health (dev server)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @ceo-agent/web build

      - name: Start web and smoke /api/health
        run: |
          setsid pnpm --filter @ceo-agent/web exec next start -p 3000 &
          web_pid=$!
          trap 'kill -- -"$web_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 2
          done
          curl --connect-timeout 2 --max-time 15 -sf http://localhost:3000/api/health | tee /tmp/health.json
          pnpm smoke:prod -- --url http://localhost:3000
          kill -- -"$web_pid" 2>/dev/null || true
          wait "$web_pid" 2>/dev/null || true

  e2e-production:
    name: E2E pipeline (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Infrastructure check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm check:infra

      - name: List E2E campaign candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: pnpm e2e:video-studio -- --list

      - name: Run E2E pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_CAMPAIGN_ID: ${{ secrets.E2E_CAMPAIGN_ID }}
          E2E_PROD_QUEUE: "1"
        run: |
          if [ -z "$E2E_CAMPAIGN_ID" ]; then
            echo "E2E_CAMPAIGN_ID secret not set — skipping full pipeline run"
            exit 0
          fi
          pnpm e2e:video-studio -- --run "$E2E_CAMPAIGN_ID"

      - name: Production smoke
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: |
          if [ -z "$PRODUCTION_APP_URL" ]; then
            echo "PRODUCTION_APP_URL secret not set — skipping production smoke"
            exit 0
          fi
          pnpm smoke:prod -- --url "$PRODUCTION_APP_URL" --strict --infra
